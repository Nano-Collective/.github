name: Prepare Release (Version PR)

# Keeps a single open "Version Packages" pull request up to date. As changesets
# land on main, that pull request accumulates them, bumps package.json, and
# rolls the entries into CHANGELOG.md.
#
# This workflow NEVER publishes. Merging the Version PR pushes a version bump to
# main, which the repository's own release.yml detects and publishes. That split
# keeps release.yml the single source of truth for publishing, and means a
# mistake here cannot ship a package.
#
# Call it from a repo with:
#
#   name: Prepare Release (Version PR)
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     release-prepare:
#       uses: Nano-Collective/.github/.github/workflows/release-prepare.yml@main

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version to build with.
        type: string
        default: '22'
      version-script:
        description: >
          Package script that performs the version bump. The default is enough
          for a plain changesets setup. A repo that post-processes CHANGELOG.md
          points this at its own script — nanocoder uses `changeset:version`,
          which runs `changeset version` and then normalises the changelog.
        type: string
        default: 'changeset:version'
      pr-title:
        description: Title for the Version Packages pull request.
        type: string
        default: 'chore: version packages'

concurrency:
  # Avoid racing the Version PR against itself when several PRs merge quickly.
  group: release-prepare-${{ github.repository }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # pin: actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      # pin: pnpm/action-setup@v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      # pin: actions/setup-node@v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the Version Packages PR
        # pin: changesets/action@v2.1.2
        #
        # v2 is required, not merely newer. v1 bundles `@changesets/read@0.6`,
        # which still understands the Changesets v1 folder format — a changeset
        # was a *directory* containing `changes.md`. Changesets v3 archives
        # already-applied changesets into `.changeset/pre/` while a repo is in
        # prerelease mode, and v1 of this action reads that archive directory as
        # a legacy changeset and dies on the `changes.md` that isn't there.
        #
        # It fails before it runs the version script, so the symptom is a repo
        # in pre mode whose *first* Version PR succeeds (no archive yet) and
        # every one after it fails. v2.0.0 dropped the Changesets v1
        # compatibility path, which is exactly the fix. It requires Changesets
        # CLI v3, which every Nano Collective repo is on.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          # `version-script:` only. No `publish-script:` input, so this action
          # never runs `changeset publish` — release.yml owns publishing.
          version-script: pnpm run ${{ inputs.version-script }}
          pr-title: ${{ inputs.pr-title }}
          commit-message: ${{ inputs.pr-title }}
          # v2 changed the default to pushing the release branch through the
          # GitHub API. Keeping the Git CLI holds today's behaviour steady so
          # this change fixes the reader and nothing else; moving to API pushes
          # (which get signed, bot-attributed commits) is a separate decision.
          push-with-git-cli: true
        # No `GITHUB_TOKEN:` env — v2 removed it. `github-token` defaults to
        # `${{ github.token }}`, and v2 *errors* if the env var is set to
        # anything that disagrees with the input.
