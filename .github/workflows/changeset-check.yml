name: Changeset Check

# A friendly, NON-BLOCKING nudge. If a pull request adds no changeset, leave one
# comment explaining how to add one; if a changeset later appears, delete the
# comment. This never fails a build — it only keeps the release-notes pipeline
# fed.
#
# Call it from a repo with:
#
#   name: Changeset Check
#   on:
#     pull_request_target:
#       types: [opened, synchronize, reopened]
#       branches: [main]
#   permissions:
#     pull-requests: write
#   jobs:
#     changeset-check:
#       uses: Nano-Collective/.github/.github/workflows/changeset-check.yml@main
#
# ---------------------------------------------------------------------------
# SECURITY: this deliberately does NOT check out the pull request
# ---------------------------------------------------------------------------
# The per-repo versions this replaces ran `pull_request_target` and then checked
# out `github.event.pull_request.head.sha` in order to `git diff` for added
# files. That combination — contributor-controlled code on disk, in a job
# holding a write-scoped token — is the standard pull_request_target footgun.
# It was not exploitable, because nothing executed the checked-out tree, but it
# was one added build step away from being so.
#
# The checkout was never necessary: the REST API returns the file list directly.
# `pulls.listFiles` gives filenames and statuses as data, so there is nothing on
# disk to execute and nothing to get wrong later.

on:
  workflow_call:

jobs:
  changeset-check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # The automated Version Packages pull request never needs a changeset.
    if: github.event.pull_request.head.ref != 'changeset-release/main'
    steps:
      - name: Comment if a changeset is missing, clean up if present
        # pin: actions/github-script@v7.0.1
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const marker = '<!-- changeset-check -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;

            // File list straight from the API — no checkout, see the security
            // note at the top of this file.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });

            // Only real changeset entries count. README.md and config.json live
            // in .changeset/ too and are not release notes.
            const hasChangeset = files.some(f =>
              f.status === 'added' &&
              /^\.changeset\/.+\.md$/.test(f.filename) &&
              f.filename !== '.changeset/README.md'
            );

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (hasChangeset) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: existing.id,
                });
                core.info('Changeset present; removed the reminder comment.');
              } else {
                core.info('Changeset present; nothing to do.');
              }
              return;
            }

            const body = [
              marker,
              '### No changeset found',
              '',
              'This PR does not add a changeset, so it will not appear in the changelog or trigger a release.',
              '',
              'If the change is user-facing, add one:',
              '',
              '```bash',
              'pnpm changeset',
              '```',
              '',
              'Pick a bump (patch / minor / major) and write the changelog entry in our usual voice ("Added **X**... Thanks to @you. Closes #123."), then commit the generated `.changeset/*.md` file.',
              '',
              'If this PR is docs-only or a chore that needs no release note, you can ignore this — or run `pnpm changeset --empty` to record that intentionally.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
