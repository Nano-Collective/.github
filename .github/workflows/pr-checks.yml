name: PR Checks

# Shared pull-request checks for every Nano Collective repository.
#
# Callers pin this with:
#
#   jobs:
#     pr-checks:
#       uses: Nano-Collective/.github/.github/workflows/pr-checks.yml@main
#
# Two groups of jobs, and the split is deliberate:
#
#   BLOCKING  — Linting, Type Checks, Format Checks, Unused Dependencies,
#               Unit Tests & Coverage Analysis, Verify Build.
#               These are the checks named in the org "Quality gates" ruleset.
#               A red one stops the merge.
#
#   ADVISORY  — Package Audit Analysis, Semgrep Security Scan, CodeQL Security
#               Analysis. These run on every PR and report, but never fail it.
#               They depend on upstream advisory feeds and third-party scanners,
#               so a disclosure landing overnight must not block an unrelated
#               contributor's bug fix.
#
# Semgrep runs in its own job on the semgrep/semgrep image. It is deliberately
# NOT invoked as `pnpm test:security` from the audit job: that script assumes
# semgrep is already on PATH, which is true locally and false on a bare runner.
#
# Toolchain is fixed: pnpm 11.0.9 on Node 22, matching every repo in the org.
# Repo-specific build steps stay in the calling repo as their own job rather
# than becoming inputs here.

on:
  workflow_call:
    inputs:
      coverage-threshold:
        description: 'Minimum line coverage percentage required to pass.'
        type: number
        default: 80
      fail-on-coverage-drop:
        description: >-
          Fail when line coverage is below the base branch. The baseline is read
          from badges/coverage.svg on the base branch, which update-badges.yml
          keeps current on main.
        type: boolean
        default: true
      verify-build:
        description: 'Run the Verify Build job. Disable for repos with no build step.'
        type: boolean
        default: true
      build-before-tests:
        description: >-
          Run `pnpm build` before the test suite. Required wherever CLI
          integration tests invoke the built entry point rather than source.
        type: boolean
        default: true
      build-output-dir:
        description: 'Directory that must exist and be non-empty after a build.'
        type: string
        default: 'dist'
      node-version:
        description: 'Node major version.'
        type: string
        default: '22'

jobs:
  # ---------------------------------------------------------------- blocking

  test-lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm test:lint

  test-types:
    name: Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type checking
        run: pnpm test:types

  test-format:
    name: Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run format check
        run: pnpm test:format

  test-knip:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency check (knip)
        run: pnpm test:knip

  test-coverage:
    name: Unit Tests & Coverage Analysis
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      FORCE_COLOR: '1'
      TERM: xterm-256color
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      baseline: ${{ steps.coverage.outputs.baseline }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CLI integration tests spawn the built binary, so dist/ has to exist
      # before the suite runs or every one of them fails.
      - name: Build project
        if: ${{ inputs.build-before-tests }}
        run: pnpm build

      - name: Run unit tests with coverage
        run: pnpm test:ava:coverage

      # Some repos emit json-summary from test:ava:coverage directly, others
      # run a bare `c8 ava`. Only regenerate when the summary is absent, and
      # let the next step produce the error if it still is.
      - name: Ensure coverage summary
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            pnpm exec c8 report --reporter=json-summary || true
          fi

      - name: Check coverage threshold and drift
        id: coverage
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
          FAIL_ON_DROP: ${{ inputs.fail-on-coverage-drop }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ ! -f coverage/coverage-summary.json ]; then
            echo "::error::No coverage report found at coverage/coverage-summary.json"
            exit 1
          fi

          COVERAGE=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"
          echo "Current line coverage: ${COVERAGE}%"

          FAILED=0

          # Absolute floor.
          if awk "BEGIN {exit !(${COVERAGE} < ${THRESHOLD})}"; then
            echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
            FAILED=1
          else
            echo "Coverage ${COVERAGE}% meets the ${THRESHOLD}% threshold"
          fi

          # Drift against the base branch. The baseline comes from the committed
          # coverage badge, which update-badges.yml refreshes on main. A repo
          # without the badge yet simply skips this check rather than failing.
          BASELINE=""
          if [ "${FAIL_ON_DROP}" = "true" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_REF}" || true
            BADGE=$(git show "origin/${BASE_REF}:badges/coverage.svg" 2>/dev/null || true)
            if [ -n "${BADGE}" ]; then
              BASELINE=$(printf '%s' "${BADGE}" \
                | grep -oE '>[0-9]+(\.[0-9]+)?%<' \
                | head -1 | tr -d '><%' || true)
            fi

            if [ -n "${BASELINE}" ]; then
              echo "baseline=${BASELINE}" >> "$GITHUB_OUTPUT"
              echo "Baseline coverage on ${BASE_REF}: ${BASELINE}%"
              if awk "BEGIN {exit !(${COVERAGE} < ${BASELINE})}"; then
                echo "::error::Coverage dropped from ${BASELINE}% to ${COVERAGE}%"
                FAILED=1
              fi
            else
              echo "::notice::No coverage baseline on ${BASE_REF}; drift check skipped"
            fi
          fi

          {
            echo "### Coverage"
            echo ""
            echo "| | % |"
            echo "|---|---|"
            echo "| This PR | ${COVERAGE} |"
            echo "| Baseline (\`${BASE_REF}\`) | ${BASELINE:-n/a} |"
            echo "| Threshold | ${THRESHOLD} |"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "${FAILED}"

  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest
    if: ${{ inputs.verify-build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Verify build output
        env:
          OUT_DIR: ${{ inputs.build-output-dir }}
        run: |
          set -euo pipefail
          if [ ! -d "${OUT_DIR}" ]; then
            echo "::error::Build output directory '${OUT_DIR}' was not created"
            exit 1
          fi
          if [ -z "$(ls -A "${OUT_DIR}")" ]; then
            echo "::error::Build output directory '${OUT_DIR}' is empty"
            exit 1
          fi
          echo "Build output present in ${OUT_DIR}/"

  # ---------------------------------------------------------------- advisory
  #
  # continue-on-error keeps these off the merge path. They are intentionally
  # NOT listed as required status checks in the Quality gates ruleset.

  package-audit:
    name: Package Audit Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm test:audit

      - name: Check for outdated dependencies
        continue-on-error: true
        run: pnpm outdated || echo "Some dependencies are outdated"

  semgrep-scan:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Equivalent to each repo's `test:security` script, but run on an image
      # that actually ships semgrep.
      - name: Run Semgrep
        run: semgrep scan --config auto --error

  codeql-scan:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # CodeQL analyses JavaScript and TypeScript together.
        language: ['javascript']
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@641a925cfafe92d0fdf8b239ba4053e3f8d99d6d
